spring:
  application:
    name: kafka-consumer-dedup

  datasource:
    url: jdbc:mysql://localhost:3306/demo_db
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8085

ordersync:
  discovery-interval-millis: 5000
  # Set to true to let the scheduler fire automatically, false for manual control via /demo endpoints
  scheduler-enabled: false

x-kafka-templates:
  producer-defaults: &producer-defaults
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  consumer-defaults: &consumer-defaults
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    trusted-packages: "com.example.kafkaconsumerdedup.*"

kafka:
  connections:
    order-sync:
      bootstrap-servers: localhost:9092

      producer:
        <<: *producer-defaults

      topics:
        navice-order-sync:
          name: naviceOrderSync
          partitions: 3
          replicas: 1
          consumers:
            audit-consumer:
              <<: *consumer-defaults
              group-id: naive-order-audit-group
              auto-offset-reset: earliest
              concurrency: 10

            monitor-consumer:
              <<: *consumer-defaults
              group-id: naive-order-monitor-group
              auto-offset-reset: latest
              concurrency: 10

        order-sync:
          name: orderSync
          partitions: 3
          replicas: 1
          consumers:
            execution-consumer:
              <<: *consumer-defaults
              group-id: order-execution-group
              auto-offset-reset: latest
              concurrency: 10

            reporting-consumer:
              <<: *consumer-defaults
              group-id: order-reporting-group
              auto-offset-reset: earliest
              concurrency: 10